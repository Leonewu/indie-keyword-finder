<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Indie Keyword Finder — Runtime Preview</title>
    <link rel="stylesheet" href="/dist/chrome-extension/sidebar.css" />
    <style>
      html {
        background: #cbd8e0;
        display: grid;
        min-height: 100%;

  <body>
    <main id="app" aria-live="polite"></main>
    <div id="toast-region" class="toast-region" aria-live="assertive"></div>
